lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  theme:
    obj:
      bg_color: 0x000000
      bg_opa: COVER
    button:
      radius: 30
      width: 60
      height: 60
      border_width: 0
      shadow_width: 0
      bg_color: !lambda return id(INACTIVE);
      bg_opa: COVER
      checked:
        bg_color: 0xFFFFFF
        bg_opa: COVER

  pages:
    - id: lockscreen_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_date
            x: 0
            y: 30
            width: 480
            text_align: CENTER
            text_font: notice_text
            text_color: 0xFFFFFF
            text: ""

        - label:
            id: lbl_time
            x: 0
            y: 55
            width: 480
            text_align: CENTER
            text_font: big_text
            text_color: 0xFFFFFF
            text: ""

        # ---------------------------------------------------
        # LVGL Button 1
        # - ALWAYS publishes a HA-friendly action: btn1_press
        # - Optional direct action: light.toggle for BTN1_ENTITY
        # ---------------------------------------------------
        - button:
            id: btn1
            x: 105
            y: 165
            checkable: true
            widgets:
              - label:
                  align: CENTER
                  text_font: materialdesign_icons
                  text_color: !lambda return id(ACTIVE);
                  text: "${BTN1_ICON}"
            on_click:
              # ALWAYS: publish action to Home Assistant (state trigger friendly)
              - script.execute:
                  id: publish_action
                  action: "btn1_press"

              # OPTIONAL: direct HA service call (plug & play)
              - if:
                  condition:
                    lambda: |-
                      return std::string("${DIRECT_ACTIONS}") == "true";
                  then:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${BTN1_ENTITY}

        - label:
            x: 105
            y: 230
            width: 60
            text_align: CENTER
            text_font: label
            text_color: 0xFFFFFF
            text: "${BTN1_LABEL}"

        # ---------------------------------------------------
        # LVGL Button 2
        # - ALWAYS publishes a HA-friendly action: btn2_press
        # ---------------------------------------------------
        - button:
            id: btn2
            x: 175
