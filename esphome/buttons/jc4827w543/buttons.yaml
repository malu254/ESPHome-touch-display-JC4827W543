            id: btn4
            x: 315
            y: 165
            checkable: true
            widgets:
              - label:
                  align: CENTER
                  text_font: materialdesign_icons
                  text_color: !lambda return id(ACTIVE);
                  text: "${BTN4_ICON}"
            on_click:
              - script.execute:
                  id: publish_action
                  action: "btn4_press"
              - if:
                  condition:
                    lambda: |-
                      return std::string("${DIRECT_ACTIONS}") == "true";
                  then:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${BTN4_ENTITY}

        - label:
            x: 315
            y: 230
            width: 60
            text_align: CENTER
            text_font: label
            text_color: 0xFFFFFF
