                  align: CENTER
                  text_font: materialdesign_icons
                  text_color: !lambda return id(ACTIVE);
                  text: "${BTN3_ICON}"
            on_click:
              - script.execute:
                  id: publish_action
                  action: "btn3_press"
              - if:
